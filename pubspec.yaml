name: whatsapp_clone
description: FSChat - A messaging app from Frames Studio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.7
  onesignal_flutter: ^5.2.0
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.42
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#075E54"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
