name: whatsapp_clone
description: Kairos - A daily life companion from Frames Studio.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.2.0
  provider: ^6.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.42
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  flutter_markdown: ^0.7.6
  cached_network_image: ^3.4.1
  image_gallery_saver_plus: ^5.0.0
  http: ^1.6.0
  file_picker: ^11.0.2
  open_file: ^4.0.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  timezone: ^0.9.4
  url_launcher: ^6.3.0

dev_dependencies:
  isar_generator: ^3.1.0
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#E65100"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
